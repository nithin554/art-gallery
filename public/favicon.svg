<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="The Gallery logo">
  <!-- Gradients -->
  <defs>
    <radialGradient id="vignette" cx="0.5" cy="0.35" r="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </radialGradient>
  </defs>

  <!-- Rounded square app-icon canvas -->
  <rect x="0" y="0" width="120" height="120" rx="22" fill="#2a2521"/>
  <!-- Subtle wall texture vignette -->
  <rect x="0" y="0" width="120" height="120" rx="22" fill="url(#vignette)"/>

  <!-- Oak picture frame (outer) -->
  <rect x="22" y="18" width="76" height="76" rx="3"
        fill="#372f26" stroke="#4c443a" stroke-width="1.5"/>
  <!-- Gold fillet -->
  <rect x="25.5" y="21.5" width="69" height="69" rx="1.5"
        fill="none" stroke="#c9a24b" stroke-width="1.2" opacity="0.85"/>
  <!-- Ivory mat / mount -->
  <rect x="30" y="26" width="60" height="52" rx="1" fill="#f2ede4"/>

  <!-- The artwork: a stylised abstract "sun over hills" painting -->
  <circle cx="55" cy="43" r="9" fill="#c9a24b" opacity="0.9"/>
  <path d="M34 76 L48 58 L58 70 L66 60 L86 76 Z" fill="#4c6b5a"/>
  <path d="M34 76 L86 76 L86 70 L66 60 L58 70 L48 58 Z" fill="#3a5245"/>

  <!-- Gold nameplate plaque -->
  <rect x="44" y="79" width="32" height="9" rx="1"
        fill="#e2dac9" stroke="#372f26" stroke-width="0.8"/>
</svg>
