# Deploy the Cloudflare Worker that lists the R2 bucket's `art` folder.
#
# Uses the Cloudflare Wrangler GitHub Action. It reads the worker source and
# config from `worker/` and connects to your Cloudflare account via the
# CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets.
#
# Triggers:
#   - push to main (when worker/ files or this workflow change)
#   - manual dispatch (Actions → "Deploy R2 Listing Worker" → Run workflow)
name: Deploy R2 Listing Worker

on:
  push:
    branches:
      - "main"
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          # Root of the worker (contains wrangler.toml).
          workingDirectory: worker
          # Cloudflare API token (needs "Workers Scripts: Edit" + R2 access).
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Cloudflare account ID.
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Deploy the worker (wrangler deploy) rather than dry-run.
          command: deploy
