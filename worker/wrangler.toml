name = "art-gallery-list"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Route the listing worker at your own domain, e.g.
# routes = [{ pattern = "list.example.com", custom_domain = true }]
# or leave unset and use the auto workers.dev URL.

# Bind the R2 bucket. Give it a short binding name and point it at your bucket.
[[r2_buckets]]
binding = "ART_BUCKET"
bucket_name = "art-gallery"

# Secrets are set with:  npx wrangler secret put GEMINI_API_KEY
# (and optionally) GEMINI_MODEL. Do NOT commit a key here.
# GEMINI_API_KEY  → Google Gemini (vision) API key, from
#                   https://aistudio.google.com/app/apikey (free tier OK)
# GEMINI_MODEL    → model name, e.g. "gemini-2.0-flash" (default)
