<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2a2521" />
    <title>The Gallery · Art Collection</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="description" content="A private, backend-free museum wall curated from your Google Photos library." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="masthead">
      <h1 class="gallery-title">The Gallery</h1>
      <p class="gallery-tagline">A private collection of moments</p>
    </header>

    <main class="stage">
      <section class="empty-state" id="emptyState">
        <p class="empty-icon" aria-hidden="true">🖼️</p>
        <h2>Your collection awaits</h2>
        <p class="empty-hint">
          Select photographs from your Google Photos library to adorn these walls.
        </p>
        <button class="btn-primary" id="pickButton" type="button">Add Photographs</button>
      </section>

      <section class="gallery-wall" id="galleryWall" aria-live="polite"></section>
    </main>

    <footer class="colophon">
      <p>
        Curated with care ·
        <a href="#" id="addMoreLink">Add photographs</a> ·
        <a href="./privacy.html">Privacy policy</a> ·
        <a href="./terms.html">Terms of service</a>
      </p>
    </footer>

    <div class="modal" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
      <button class="modal-close" id="closeLightbox" type="button" aria-label="Close">×</button>
      <button class="modal-nav modal-prev" id="prevImage" type="button" aria-label="Previous">‹</button>
      <figure class="modal-content">
        <img id="lightboxImage" src="" alt="" />
        <figcaption class="modal-caption" id="lightboxCaption"></figcaption>
      </figure>
      <button class="modal-nav modal-next" id="nextImage" type="button" aria-label="Next">›</button>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
